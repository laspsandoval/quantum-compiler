[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# Project configuration
# ---------------------

[project]
name = "quantum-compiler"
version = "0.1.0"
description = "A quantum circuit simulator and compiler built from scratch."
authors = [{name = "Laura Sandoval"}]
readme = "README.md"
license = "MIT"
keywords = ["quantum", "compiler", "transpiler", "qubit routing", "SABRE", "neutral atoms"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Compilers",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2,<3",
]

[project.urls]
repository = "https://github.com/laspsandoval/quantum-compiler"

# Dependencies
# ------------

[project.optional-dependencies]
dev = ["pre-commit>=4,<5", "ruff==0.15.20", "mypy==2.1.0"]
test = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.2,<4", "hypothesis>=6"]
# Reference implementations: used to cross-check our simulator/compiler
# results and to benchmark against (e.g. our router vs. Qiskit's SABRE).
qiskit = ["qiskit>=2"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8"]

[tool.poetry]
packages = [{include = "quantum_compiler"}]

# Tool settings
# -------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "qiskit: cross-checks against Qiskit (requires the 'qiskit' extra)",
    "slow: long-running benchmarks (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["quantum_compiler"]

[tool.ruff]
target-version = "py311"
lint.select = ["B", "D", "E", "F", "I", "N", "S", "W", "PL", "PT", "UP", "RUF"]
lint.ignore = [
  "D104",  # Missing docstring in public package
  "N802",  # Function name should be lowercase (allow gate names like `CNOT`, `H`)
  "N803",  # Argument name should be lowercase (allow matrix names like `U`)
  "N806",  # Variable in function should be lowercase (allow `U`, `H`, `CX`)
  "PLR0913",  # too-many-args
  "PLR2004",  # Magic value in comparison
  "RUF002",  # Ambiguous unicode in docstrings (allow ψ, θ, ⊗, †)
  "RUF003",  # Ambiguous unicode in comments
  "S311",  # Non-cryptographic random (fine for measurement sampling)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PT006", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.codespell]
ignore-words-list = "ket,nd"

[tool.numpydoc_validation]
checks = ["all",  # report on all checks, except the following
    "EX01",  # No examples section found
    "SA01",  # See Also section not found
    "ES01",  # No extended summary found
    "RT02",  # The first line of the Returns section
]
exclude = ['__init__', '_version']

[tool.mypy]
disable_error_code = [
    'import-not-found',
    'import-untyped',
    'no-any-return',
]
strict = true
explicit_package_bases = true
exclude = ["tests"]
packages = ["quantum_compiler"]
